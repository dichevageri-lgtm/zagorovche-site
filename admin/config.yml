backend:
  name: github
  repo: dichevageri-lgtm/zagorovche-site
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "bg"

collections:
  - name: "novini"
    label: "Новини"
    folder: "content/novini"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Заглавие", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Снимка", name: "image", widget: "image", required: false}
      - {label: "Текст", name: "body", widget: "markdown"} 
